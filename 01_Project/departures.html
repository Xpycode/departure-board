<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BVG Departures Widget</title>
<style>
  :root {
    --bg: #11151c;
    --panel: #1a212b;
    --border: #2a3441;
    --text: #e8edf4;
    --dim: #8ea0b5;
    --s-color: #008d4b;
    --u-color: #005a94;
    --r-color: #b03030;
    --warn: #ffb347;
    --scale: 1;
    --ts: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    width: calc(340px * var(--scale));
  }
  .widget {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .station { padding: calc(8px * var(--scale)) calc(12px * var(--scale)) calc(10px * var(--scale)); }
  .station + .station { border-top: 1px solid var(--border); }
  .station-head {
    display: flex;
    align-items: center;
    gap: calc(6px * var(--scale));
    margin-bottom: calc(6px * var(--scale));
  }
  .badge {
    display: inline-block;
    min-width: calc(20px * var(--scale));
    text-align: center;
    font-weight: 700;
    font-size: calc(13px * var(--scale));
    padding: calc(1px * var(--scale)) calc(5px * var(--scale));
    border-radius: 4px;
    color: #fff;
  }
  .badge.s { background: var(--s-color); }
  .badge.u { background: var(--u-color); }
  .badge.r { background: var(--r-color); }
  .station-name {
    font-size: calc(13px * var(--scale));
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .r-countdown {
    margin-left: auto;
    padding-left: calc(6px * var(--scale));
    font-size: calc(10px * var(--scale));
    color: var(--dim);
    white-space: nowrap;
  }
  .station-error {
    font-size: calc(12px * var(--scale));
    color: var(--warn);
    padding: calc(2px * var(--scale)) 0 calc(4px * var(--scale));
  }
  table { width: 100%; border-collapse: collapse; }
  td { padding: calc(2px * var(--scale)) 0; font-size: calc(13px * var(--scale)); vertical-align: baseline; }
  td.line { width: calc(52px * var(--scale)); }
  td.line span {
    display: inline-block;
    min-width: calc(34px * var(--scale));
    text-align: center;
    font-weight: 700;
    font-size: calc(12px * var(--scale));
    padding: calc(1px * var(--scale)) calc(4px * var(--scale));
    border-radius: 3px;
    color: #fff;
    background: #444;
  }
  td.line span.suburban { background: var(--s-color); }
  td.line span.subway { background: var(--u-color); }
  td.line span.regional { background: var(--r-color); }
  td.dir {
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(150px * var(--scale));
  }
  td.when { text-align: right; font-weight: 700; white-space: nowrap; }
  td.when.soon { color: var(--warn); }
  td.when .delay { font-weight: 400; font-size: calc(11px * var(--scale)); color: var(--warn); margin-left: calc(3px * var(--scale)); }
  .ticker {
    display: flex;
    align-items: stretch;
    overflow: hidden;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,.25);
    font-size: calc(var(--ts) * var(--scale));
    color: var(--warn);
  }
  .ticker .text { flex: 1; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .ticker .scroll {
    display: inline-block;
    white-space: nowrap;
    padding: calc(3px * var(--scale)) 0 calc(3px * var(--scale)) 100%;
    animation: ticker-scroll linear infinite;
  }
  .ticker .count {
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 calc(6px * var(--scale));
    border-left: 1px solid var(--border);
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  .footer {
    display: flex;
    justify-content: space-between;
    padding: calc(4px * var(--scale)) calc(12px * var(--scale));
    background: rgba(0,0,0,.25);
    font-size: calc(10px * var(--scale));
    color: var(--dim);
  }
  .footer .right { display: flex; align-items: center; gap: calc(6px * var(--scale)); }
  .cfg-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    padding: 0 calc(5px * var(--scale));
    font-size: calc(9px * var(--scale));
    font-family: inherit;
    color: var(--dim);
  }
  .cfg-btn:hover { color: var(--text); }
  .cfg-panel {
    display: none;
    padding: calc(10px * var(--scale)) calc(12px * var(--scale));
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .cfg-panel.open { display: block; }
  .cfg-panel label {
    display: block;
    font-size: calc(10px * var(--scale));
    color: var(--dim);
    margin: calc(6px * var(--scale)) 0 calc(2px * var(--scale));
  }
  .cfg-panel input {
    width: 100%;
    padding: calc(3px * var(--scale)) calc(6px * var(--scale));
    font-size: calc(12px * var(--scale));
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .cfg-actions { display: flex; gap: calc(6px * var(--scale)); margin-top: calc(10px * var(--scale)); }
  .cfg-actions button {
    flex: 1;
    padding: calc(4px * var(--scale)) 0;
    font-size: calc(12px * var(--scale));
    font-weight: 600;
    color: #fff;
    background: var(--u-color);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .cfg-actions button.secondary {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="station" id="station-s"></div>
  <div class="station" id="station-u"></div>
  <div class="station" id="station-r"></div>
  <div class="ticker" id="ticker" style="display: none"></div>
  <div class="footer">
    <span id="status">loading…</span>
    <span class="right">
      <button class="cfg-btn" id="cfg-open" title="Configure stations">setup</button>
      <span id="updated"></span>
    </span>
  </div>
  <div class="cfg-panel" id="cfg-panel">
    <label for="cfg-s">S-Bahn station</label>
    <input id="cfg-s" placeholder="S Humboldthain">
    <label for="cfg-sl">S lead time (min walk — hides trains leaving sooner)</label>
    <input id="cfg-sl" type="number" min="0" step="1" value="8">
    <label for="cfg-u">U-Bahn station</label>
    <input id="cfg-u" placeholder="U Voltastraße">
    <label for="cfg-ul">U lead time (min walk — hides trains leaving sooner)</label>
    <input id="cfg-ul" type="number" min="0" step="1" value="12">
    <label for="cfg-r">Regional stations (comma-sep., cycled every 20 s)</label>
    <input id="cfg-r" placeholder="S+U Gesundbrunnen,S Charlottenburg,S Ostbahnhof">
    <label for="cfg-rl">RE lead time (min, one per station, comma-sep.) — hides trains leaving sooner than the walk there</label>
    <input id="cfg-rl" placeholder="10  or  10,20">
    <label for="cfg-rf">Only these RE lines (comma-sep., empty = all, e.g. RE,ICE)</label>
    <input id="cfg-rf" placeholder="RE,ICE">
    <label for="cfg-n">Departures per direction</label>
    <input id="cfg-n" type="number" min="1" max="4" value="2">
    <label for="cfg-scale">Display scale (0.8–2, resize the iframe to match)</label>
    <input id="cfg-scale" type="number" step="0.1" min="0.8" max="2" value="1">
    <label for="cfg-ts">Info line text size (px, 8–18)</label>
    <input id="cfg-ts" type="number" step="1" min="8" max="18" value="12">
    <div class="cfg-actions">
      <button id="cfg-save">Save</button>
      <button id="cfg-reset" class="secondary">Reset</button>
      <button id="cfg-cancel" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Station configuration precedence:
  //   URL params > saved config (localStorage, set via the built-in setup
  //   panel in the footer) > defaults.
  // Values may be IBNRs (digits) or station names; names are resolved
  // automatically via the /stops?query= endpoint (the returned de:11000:*
  // ids are converted to the IBNR the departures endpoint requires).
  var params = new URLSearchParams(location.search);
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem("bvg-widget-config") || "{}"); } catch (e) {}
  function cfgValue(key, fallback) {
    return params.get(key) || saved[key] || fallback;
  }
  function parseLead(value) {
    var n = parseInt(value, 10);
    return isNaN(n) || n < 0 ? 0 : n;
  }
  var STOPS = [
    { key: "s", kind: "suburban", label: "S", el: document.getElementById("station-s"),
      stop: cfgValue("s", "S Humboldthain"), minLead: parseLead(cfgValue("sl", "8")) },
    { key: "u", kind: "subway", label: "U", el: document.getElementById("station-u"),
      stop: cfgValue("u", "U Voltastraße"), minLead: parseLead(cfgValue("ul", "12")) }
  ];
  var REGIONAL_STOPS = String(cfgValue("r", "S+U Gesundbrunnen,S Charlottenburg,S Ostbahnhof"))
    .split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  // Lead time per RE station (minutes): departures sooner than the walk
  // to that station are hidden. One value applies to all; a comma list
  // aligns with the r stops.
  var REGIONAL_LEADS = String(cfgValue("rl", "10")).split(",")
    .map(function (s) { return parseInt(s.trim(), 10); })
    .filter(function (v) { return !isNaN(v) && v >= 0; });
  // Optional RE line filter (comma-separated, substring match, e.g. RE,ICE).
  var REGIONAL_LINES = String(cfgValue("rf", "")).split(",")
    .map(function (s) { return s.trim().toUpperCase(); }).filter(Boolean);
  var PER_DIRECTION = parseInt(cfgValue("n", "2"), 10);
  var SCALE = Math.min(2, Math.max(0.8, parseFloat(cfgValue("scale", "1")) || 1));
  document.documentElement.style.setProperty("--scale", String(SCALE));
  var TICKER_SIZE = Math.min(18, Math.max(8, parseFloat(cfgValue("ts", "12")) || 12));
  document.documentElement.style.setProperty("--ts", TICKER_SIZE + "px");
  var API = "https://v6.bvg.transport.rest";
  var REFRESH_MS = 30000;
  var ROTATE_MS = 20000;
  var rIndex = 0;
  // Product filtering on the BVG v6 API: the per-product booleans
  // (suburban, subway, tram, bus, ferry, express, regional) are include
  // flags that all default to true, so filtering happens by excluding
  // unwanted products with =false. ("express" covers IC/ICE/EC; there are
  // no regionalExp/national params on this instance.)
  var PRODUCTS = ["suburban", "subway", "tram", "bus", "ferry", "express", "regional"];
  var R_PRODUCTS = ["regional", "express"];
  var regionalCfg = { key: "r", label: "RE", el: document.getElementById("station-r"),
    lineFilter: REGIONAL_LINES.length ? REGIONAL_LINES : null };
  var tickerEl = document.getElementById("ticker");
  var idCache = {};

  function fetchJSON(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  // Query fragment excluding all products not in the keep list.
  function productsQuery(keep) {
    return PRODUCTS.filter(function (p) { return keep.indexOf(p) === -1; })
      .map(function (p) { return p + "=false"; }).join("&");
  }

  function mins(dep) {
    var when = dep && (dep.when || dep.plannedWhen);
    if (!when) return 0;
    var m = Math.round((new Date(when) - Date.now()) / 60000);
    return Math.max(0, m);
  }

  function fmt(dep) {
    var m = mins(dep);
    if (m === 0) return "now";
    if (m < 60) return m + " min";
    return new Date(dep.when || dep.plannedWhen).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " *";
  }

  // Departures to display for a block: right product, not leaving sooner
  // than the lead time, and matching the optional line filter.
  function usableDepartures(cfg, data) {
    var lead = cfg.minLead || 0;
    var lineFilter = cfg.lineFilter || null;
    return (data.departures || []).filter(function (d) {
      if (!d.line) return false;
      var keep = cfg.kind ? d.line.product === cfg.kind
        : R_PRODUCTS.indexOf(d.line.product) !== -1;
      if (!keep) return false;
      // Skip trains leaving sooner than the lead time (walk to the station).
      if (lead > 0 && mins(d) < lead) return false;
      // Optional substring line filter, e.g. "RE" matches RE5, "ICE 838".
      if (lineFilter) {
        var name = String(d.line.name || "").toUpperCase();
        return lineFilter.some(function (f) { return name.indexOf(f) !== -1; });
      }
      return true;
    });
  }

  function renderStation(cfg, data) {
    var departures = usableDepartures(cfg, data);

    // Collect system-wide disruption messages ("warning" remarks) of the
    // displayed trains for the info line; flatten HTML in the texts.
    cfg.warnings = [];
    departures.forEach(function (d) {
      (d.remarks || []).forEach(function (r) {
        if (r.type === "warning" && r.text) {
          var w = stripHtml(r.text);
          if (w && cfg.warnings.indexOf(w) === -1) cfg.warnings.push(w);
        }
      });
    });

    // Group into directions by the line's terminus (direction field).
    var seen = {}, dirs = [];
    departures.forEach(function (d) {
      var dir = (d.direction || d.destination && d.destination.name || "?").trim();
      if (!seen[dir]) { seen[dir] = []; dirs.push(dir); }
      if (seen[dir].length < PER_DIRECTION) seen[dir].push(d);
    });

    var rows = "";
    dirs.slice(0, 2).forEach(function (dir) {
      seen[dir].forEach(function (d) {
        var m = mins(d);
        var delay = "";
        if (d.delay && d.delay > 0) delay = "+" + Math.round(d.delay / 60);
        var cls = m <= 2 ? " soon" : "";
        var lineName = (d.line.name || "").replace(/^(S|U)-?Bahn\s*/i, "");
        var lineCls = cfg.kind || "regional";
        rows += "<tr>" +
          '<td class="line"><span class="' + lineCls + '">' + lineName + "</span></td>" +
          '<td class="dir" title="' + escapeHtml(dir) + '">' + escapeHtml(dir) + "</td>" +
          '<td class="when' + cls + '">' + fmt(d) +
          '<span class="delay">' + delay + "</span></td>" +
          "</tr>";
      });
    });

    var head =
      '<div class="station-head">' +
      '<span class="badge ' + cfg.key + '">' + cfg.label + "</span>" +
      '<span class="station-name">' + escapeHtml(stationName(data, departures, cfg)) + "</span>";
    if (cfg.key === "r" && REGIONAL_STOPS.length > 1) {
      head += '<span class="r-countdown" id="r-countdown"></span>';
    }
    head += "</div>";
    cfg.el.innerHTML = head +
      (rows
        ? "<table><tbody>" + rows + "</tbody></table>"
        : '<div class="station-error">No departures in the next ' +
          (cfg.key === "r" ? "4 h" : "30 min") + "</div>");
    updateTicker();
  }

  // Info line, like real station boards: shows the disruption warnings
  // ("warning" remarks) of all displayed trains, one message at a time.
  // The counter ("2/5") jumps to the next message on click, clicking the
  // text cycles the scroll speed (1x -> 2x -> 4x), and a completed scroll
  // pass auto-advances. Message-list updates (e.g. when the RE station
  // switches) are applied only at the end of the current scroll pass, so
  // the running text never visibly restarts or blanks.
  var tickerMsgs = [];
  var tickerNext = null;
  var tickerIdx = 0;
  var tickerSpeed = 1;
  var tickerBaseSec = 15;

  function setTickerDuration() {
    var scroll = tickerEl.querySelector(".scroll");
    if (scroll) {
      scroll.style.animationDuration =
        Math.max(4, Math.round(tickerBaseSec / tickerSpeed)) + "s";
    }
  }

  function renderTickerMsg() {
    if (!tickerMsgs.length) return;
    var text = tickerMsgs[tickerIdx];
    tickerBaseSec = Math.max(15, Math.round(text.length * 0.4));
    tickerEl.style.display = "flex";
    tickerEl.innerHTML =
      '<span class="text"><span class="scroll">' + escapeHtml(text) + "</span></span>" +
      '<span class="count" title="Next message">' +
      (tickerIdx + 1) + "/" + tickerMsgs.length + "</span>";
    setTickerDuration();
    tickerEl.querySelector(".scroll").addEventListener("animationiteration", onTickerPassEnd);
  }

  // A full scroll pass completed (the text just exited on the left):
  // apply any pending message-list change and advance to the next message.
  function onTickerPassEnd() {
    if (tickerNext !== null) {
      var current = tickerMsgs[tickerIdx];
      tickerMsgs = tickerNext;
      tickerNext = null;
      if (!tickerMsgs.length) {
        tickerEl.style.display = "none";
        tickerEl.innerHTML = "";
        return;
      }
      if (current && tickerMsgs.indexOf(current) !== -1) tickerIdx = tickerMsgs.indexOf(current);
      else if (tickerIdx >= tickerMsgs.length) tickerIdx = 0;
    }
    showTickerMsg(tickerIdx + 1);
  }

  function showTickerMsg(i) {
    if (!tickerMsgs.length) return;
    tickerIdx = (i + tickerMsgs.length) % tickerMsgs.length;
    renderTickerMsg();
  }

  tickerEl.addEventListener("click", function (e) {
    if (e.target.classList.contains("count")) {
      showTickerMsg(tickerIdx + 1);
    } else {
      tickerSpeed = tickerSpeed === 1 ? 2 : tickerSpeed === 2 ? 4 : 1;
      setTickerDuration();
    }
  });

  function updateTicker() {
    var seen = {}, msgs = [];
    [STOPS[0], STOPS[1], regionalCfg].forEach(function (cfg) {
      (cfg.warnings || []).forEach(function (w) {
        if (!seen[w]) { seen[w] = true; msgs.push(w); }
      });
    });
    var joined = msgs.join("\u0000");
    if (tickerNext && joined === tickerNext.join("\u0000")) return;
    if (joined === tickerMsgs.join("\u0000")) { tickerNext = null; return; }
    // Nothing displayed yet (or only hidden content): show immediately.
    if (!tickerMsgs.length) {
      if (!msgs.length) return;
      tickerMsgs = msgs;
      tickerIdx = 0;
      renderTickerMsg();
      return;
    }
    // Otherwise defer to the end of the current scroll pass.
    tickerNext = msgs;
  }

  function stationName(data, departures, cfg) {
    var name = departures.length && departures[0].stop && departures[0].stop.name;
    if (!name) name = data.stop && data.stop.name;
    if (!name) name = cfg.requestedStop;
    name = (name || "Station").replace(/\s*\(Berlin\)$/, "").replace(/ Bhf$/, "");
    return name;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // API remark texts may contain HTML (some warnings are a bare link
  // element); flatten anchors to "label: URL" and strip any other tags.
  function stripHtml(s) {
    return String(s)
      .replace(/<a\b[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi,
        function (m, url, label) { return label.trim() + ": " + url; })
      .replace(/<[^>]*>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function setStatus(text, isErr) {
    var el = document.getElementById("status");
    el.textContent = text;
    el.style.color = isErr ? "var(--warn)" : "";
  }

  function ibnrFromId(id) {
    var m = /[0-9]{6,}/.exec(String(id || ""));
    return m ? m[0] : null;
  }

  function resolveId(stop) {
    if (/^\d{6,}$/.test(stop)) return Promise.resolve(stop);
    if (idCache[stop]) return Promise.resolve(idCache[stop]);
    return fetchJSON(API + "/stops?query=" + encodeURIComponent(stop) + "&results=5")
      .then(function (stops) {
        // The API returns stations (type "station") with de:11000:<IBNR> ids;
        // the departures endpoint needs the bare IBNR.
        for (var i = 0; i < stops.length; i++) {
          var ibnr = ibnrFromId(stops[i].id);
          if (ibnr && (stops[i].type === "stop" || stops[i].type === "station")) {
            idCache[stop] = ibnr;
            return ibnr;
          }
        }
        throw new Error("stop not found: " + stop);
      });
  }

  function loadDepartures(cfg, stop, query) {
    cfg.requestedStop = stop;
    return resolveId(stop)
      .then(function (id) {
        return fetchJSON(API + "/stops/" + encodeURIComponent(id) + "/departures?" + query);
      })
      .then(function (data) { renderStation(cfg, data); return data; })
      .catch(function (err) {
        cfg.warnings = [];
        cfg.el.innerHTML =
          '<div class="station-head"><span class="badge ' + cfg.key + '">' + cfg.label +
          '</span><span class="station-name">' + escapeHtml(stop) + "</span></div>" +
          '<div class="station-error">API error: ' + escapeHtml(err.message) + "</div>";
        setStatus("API error", true);
        updateTicker();
      });
  }

  function regionalLead(idx) {
    if (!REGIONAL_LEADS.length) return 0;
    return REGIONAL_LEADS[Math.min(idx, REGIONAL_LEADS.length - 1)];
  }

  // Loads the current RE cycling station. Regional trains run every 20-30+
  // minutes and construction can thin them out further, so fetch a long
  // window (4 hours): the block shows the next trains that actually leave,
  // however far out, and rotates through every configured station in turn.
  function loadRegional() {
    if (!REGIONAL_STOPS.length) return;
    var idx = rIndex % REGIONAL_STOPS.length;
    regionalCfg.minLead = regionalLead(idx);
    loadDepartures(regionalCfg, REGIONAL_STOPS[idx],
      "results=20&duration=240&remarks=true&" + productsQuery(R_PRODUCTS));
  }

  function refresh() {
    STOPS.forEach(function (cfg) {
      loadDepartures(cfg, cfg.stop, "results=20&duration=30&remarks=true&" + productsQuery([cfg.kind]));
    });
    loadRegional();
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    setStatus("BVG live");
  }

  // Built-in setup panel: configure stations in the browser; saved to
  // localStorage so the served file itself never needs editing.
  var cfgPanel = document.getElementById("cfg-panel");
  document.getElementById("cfg-open").addEventListener("click", function () {
    document.getElementById("cfg-s").value = STOPS[0].stop;
    document.getElementById("cfg-sl").value = STOPS[0].minLead;
    document.getElementById("cfg-u").value = STOPS[1].stop;
    document.getElementById("cfg-ul").value = STOPS[1].minLead;
    document.getElementById("cfg-r").value = REGIONAL_STOPS.join(",");
    document.getElementById("cfg-rl").value = REGIONAL_LEADS.join(",");
    document.getElementById("cfg-rf").value = REGIONAL_LINES.join(",");
    document.getElementById("cfg-n").value = PER_DIRECTION;
    document.getElementById("cfg-scale").value = SCALE;
    document.getElementById("cfg-ts").value = TICKER_SIZE;
    cfgPanel.classList.add("open");
    notifySize();
  });
  document.getElementById("cfg-cancel").addEventListener("click", function () {
    cfgPanel.classList.remove("open");
    notifySize();
  });
  document.getElementById("cfg-reset").addEventListener("click", function () {
    localStorage.removeItem("bvg-widget-config");
    location.reload();
  });
  document.getElementById("cfg-save").addEventListener("click", function () {
    var n = parseInt(document.getElementById("cfg-n").value, 10);
    var scale = parseFloat(document.getElementById("cfg-scale").value);
    var ts = parseFloat(document.getElementById("cfg-ts").value);
    localStorage.setItem("bvg-widget-config", JSON.stringify({
      s: document.getElementById("cfg-s").value.trim(),
      sl: document.getElementById("cfg-sl").value.trim(),
      u: document.getElementById("cfg-u").value.trim(),
      ul: document.getElementById("cfg-ul").value.trim(),
      r: document.getElementById("cfg-r").value.trim(),
      rl: document.getElementById("cfg-rl").value.trim(),
      rf: document.getElementById("cfg-rf").value.trim(),
      n: isNaN(n) ? 2 : n,
      scale: isNaN(scale) ? 1 : Math.min(2, Math.max(0.8, scale)),
      ts: isNaN(ts) ? 12 : Math.min(18, Math.max(8, ts))
    }));
    location.reload();
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
  if (REGIONAL_STOPS.length > 1) {
    // One ticker drives the RE rotation: counts down to the next station
    // switch and shows the remaining seconds in the RE block header. Every
    // configured station gets its slot in turn, even if it has no
    // departures in the fetch window (shown honestly while it lasts).
    var rSecondsLeft = ROTATE_MS / 1000;
    setInterval(function () {
      rSecondsLeft--;
      if (rSecondsLeft <= 0) {
        rIndex++;
        loadRegional();
        rSecondsLeft = ROTATE_MS / 1000;
      }
      var cd = document.getElementById("r-countdown");
      if (cd) {
        cd.textContent = "→ " + REGIONAL_STOPS[(rIndex + 1) % REGIONAL_STOPS.length] +
          " · " + rSecondsLeft + " s";
      }
    }, 1000);
  }

  // Report the rendered size to the embedding page so the iframe can fit
  // the content exactly (the widget cannot resize its own frame). Works
  // cross-origin via postMessage; the parent decides whether to listen.
  // Measures the widget element: document scroll sizes never shrink below
  // the current iframe size, which froze the frame at its largest size.
  // Only posts when the size actually changed, so renders that keep the
  // layout (routine refreshes, ticker updates) do not touch the frame.
  var lastReportedSize = "";
  function notifySize() {
    if (window.parent === window) return;
    var box = document.getElementById("widget");
    var w = box.offsetWidth, h = box.offsetHeight;
    var key = w + "x" + h;
    if (key === lastReportedSize) return;
    lastReportedSize = key;
    window.parent.postMessage({ type: "bvg-widget-size", width: w, height: h }, "*");
  }
  new MutationObserver(notifySize).observe(document.getElementById("widget"),
    { childList: true, subtree: true, characterData: true });
  notifySize();
})();
</script>
</body>
</html>
